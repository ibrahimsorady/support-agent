name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile all sources (catches syntax errors)
        run: python -m compileall -q app.py src mock_backend evals scripts tests

      - name: Run offline unit tests (no API key needed)
        run: python -m pytest tests/ -v
